name: JohnnyVac to Shopify Sync

on:
  # Run daily at 7 AM UTC
  schedule:
    - cron: '0 7 * * *'

  # Allow manual triggering with options
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes made)'
        required: false
        type: boolean
        default: false
      create_collections:
        description: 'Create/update collections after sync'
        required: false
        type: boolean
        default: false
      auto_publish:
        description: 'Auto-publish new collections'
        required: false
        type: boolean
        default: false
      archive_missing:
        description: 'Archive products that left the feed (ARCHIVED + 301 redirect)'
        required: false
        type: boolean
        default: true
      archive_cap:
        description: 'Most LIVE products one run may take off the storefront; over this the run archives nothing and fails'
        required: false
        type: number
        default: 50
      model_ai_cap:
        description: 'Most parts the AI model back-fill may look at this run (0 = rules only)'
        required: false
        type: number
        default: 500

# A manual run queues behind the scheduled one instead of racing it.
concurrency:
  group: shopify-sync
  cancel-in-progress: false

jobs:
  sync-products:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic

      - name: Unit tests (sync rules)
        run: python -m unittest discover -s tests

      - name: Validate configuration files
        run: |
          echo "Validating category_map_v4.json..."
          python - <<EOF
          import json
          import sys
          
          try:
              with open("category_map_v4.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              
              assert "settings" in data, "Missing 'settings' key"
              assert "categories" in data, "Missing 'categories' key"
              assert "jv_category_mappings" in data, "Missing 'jv_category_mappings' key"
              
              print(f"✅ Loaded {len(data['categories'])} categories")
              print(f"✅ Loaded {len(data['jv_category_mappings'])} JV category mappings")
              handles = {c["handle"] for c in data["categories"]}
              for jv, target in data["jv_category_mappings"].items():
                  if isinstance(target, dict):
                      assert target["handle"] in handles, f"'{jv}' maps to unknown category {target['handle']}"
              for old, new in data["settings"].get("collections", {}).get("retired_handles", {}).items():
                  assert old not in handles, f"retired handle {old} is still a category"
                  assert new in handles, f"retired handle {old} points at unknown category {new}"
              print(f"✅ Configuration valid")
              
          except Exception as e:
              print(f"❌ Validation failed: {e}")
              sys.exit(1)
          EOF

      - name: Sync products to Shopify
        id: sync
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-4-8' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          ARCHIVE_MISSING: ${{ github.event.inputs.archive_missing || 'true' }}
          MAX_ARCHIVE_PER_RUN: ${{ github.event.inputs.archive_cap || '50' }}
          MODEL_AI_CAP: ${{ github.event.inputs.model_ai_cap || '500' }}
          MODEL_BACKFILL_MODEL: ${{ vars.MODEL_BACKFILL_MODEL || 'claude-sonnet-5-5' }}
        run: |
          echo "Starting JohnnyVac product sync..."
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔸 DRY RUN MODE - No changes will be made"
          fi
          python -u sync_shopify_bulk_v3.py

      - name: Upload needs_review.csv artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: needs-review-report
          path: needs_review.csv
          if-no-files-found: ignore

      - name: Upload skipped_products.csv artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skipped-products-report
          path: skipped_products.csv
          if-no-files-found: ignore

      # Collections stay in step with the catalog: every scheduled run
      # creates/updates category + brand collections (idempotent), and manual
      # runs can opt in via the create_collections input.
      - name: Create/update automated collections
        if: github.event_name == 'schedule' || github.event.inputs.create_collections == 'true'
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          AUTO_PUBLISH: ${{ github.event.inputs.auto_publish || 'true' }}
        run: |
          echo "Creating / updating Shopify automated collections..."
          python create_collections.py

      # Buyable first: in stock + photo, then in stock, then sold out. Runs
      # after the collections step so a collection it just created is ranked
      # the same day. Only products whose place changed are moved.
      - name: Rank collections (in stock first)
        if: github.event_name == 'schedule' || github.event.inputs.create_collections == 'true'
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -u sort_collections.py

      - name: Job summary
        if: always()
        run: |
          {
            echo "## JohnnyVac → Shopify Sync Summary"
            echo ""
            echo "### Run Configuration"
            echo "- 🔄 Dry run: ${{ github.event.inputs.dry_run || 'false' }}"
            echo "- 🗑️ Archive missing: ${{ github.event.inputs.archive_missing || 'true' }} (cap ${{ github.event.inputs.archive_cap || '50' }} per run)"
            echo ""
            echo "### Results"
            echo "- 🧹 Product sync: ${{ steps.sync.outcome }} (details above)"
            if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.create_collections }}" == "true" ]]; then
              echo "- 🗂️ Collections: Created / Updated, ranked in stock first"
              echo "- 🚀 Auto publish: ${{ github.event.inputs.auto_publish || 'true' }}"
            else
              echo "- 🗂️ Collections: Skipped"
            fi
            if [[ "${{ secrets.ANTHROPIC_API_KEY }}" == "" ]]; then
              echo "- 🧠 AI steps: ⚠️ SKIPPED — add the ANTHROPIC_API_KEY repo secret to enable the AI model back-fill and Claude-written descriptions (rules and templates only for now)"
            else
              echo "- 🧠 AI steps (model back-fill, descriptions): enabled"
            fi
            echo ""
            echo "### Reports"
            echo "- 📄 needs_review.csv: Products that couldn't be auto-categorized, plus every model the back-fill found (models:rule / models:ai)"
            echo "- 📄 skipped_products.csv: Feed rows the never-sell rules exclude"
            echo ""
            echo "### Timestamp"
            echo "- ⏰ UTC: $(date -u)"
          } >> $GITHUB_STEP_SUMMARY
