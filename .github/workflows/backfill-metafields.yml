name: Backfill Product Metafields

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - 'dry-run'
          - 'live'
      limit:
        description: 'Limit products (leave empty for all)'
        required: false
        default: ''
        type: string

jobs:
  backfill-metafields:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Metafields Backfill
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="--limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.mode }}" == "live" ]; then
            echo "⚡ Running in LIVE mode"
            python backfill_metafields.py --live $ARGS
          else
            echo "🔍 Running in DRY RUN mode"
            python backfill_metafields.py --dry-run $ARGS
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Product Metafields Backfill"
            echo ""
            echo "- Mode: ${{ inputs.mode }}"
            echo "- Limit: ${{ inputs.limit || 'all products' }}"
            echo "- ⏰ $(date -u)"
          } >> $GITHUB_STEP_SUMMARY
